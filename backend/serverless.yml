service: sports-cart-api
frameworkVersion: '3'

useDotenv: true

plugins: ${file(serverless/config/plugins.yml)}

provider: ${file(serverless/config/provider.yml)}

custom: ${file(serverless/config/custom.yml)}

functions:
  auth: ${file(serverless/functions/auth.yml)}
  products: ${file(serverless/functions/products.yml)}
  cart: ${file(serverless/functions/cart.yml)}
  orders: ${file(serverless/functions/orders.yml)}
  adminProducts: ${file(serverless/functions/admin-products.yml)}
  adminUsers: ${file(serverless/functions/admin-users.yml)}
  adminOrders: ${file(serverless/functions/admin-orders.yml)}
  adminRoles: ${file(serverless/functions/admin-roles.yml)}
  adminSuppliers: ${file(serverless/functions/admin-suppliers.yml)}
  adminPurchases: ${file(serverless/functions/admin-purchases.yml)}
  adminInventory: ${file(serverless/functions/admin-inventory.yml)}
  discounts: ${file(serverless/functions/discounts.yml)}
  adminDiscounts: ${file(serverless/functions/admin-discounts.yml)}
  adminReports: ${file(serverless/functions/admin-reports.yml)}
  adminAudit: ${file(serverless/functions/admin-audit.yml)}
